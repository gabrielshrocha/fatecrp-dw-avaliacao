<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Jogos de Tabuleiro</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Central Jogos de Tabuleiro</h1>
    </header>

    <main>
        
        <section>
            <h2>Buscar jogos</h2>
            
            <label for="busca-jogo">Nome do jogo:</label>
            <input 
                type="text" 
                id="busca-jogo" 
                placeholder="Digite o nome do jogo..."
            >

            <label for="filtro-categoria">Categoria:</label>
            <select id="filtro-categoria">
                <option value="Todas">Todas</option>
                <option value="Estratégia">Estratégia</option>
                <option value="Cooperativo">Cooperativo</option>
                <option value="Negociação">Negociação</option>
                <option value="Investigação">Investigação</option>
            </select>
        </section>
            
        <section id="lista-jogos"></section>
    </main>

    <footer>
        <p>Projeto de JavaScript — GABRIEL S H ROCHA e JOÃO VICTOR TAVARES</p>
    </footer>

</body>
</html>
