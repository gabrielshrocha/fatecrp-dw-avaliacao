<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Jogos de Tabuleiro</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Central Jogos de Tabuleiro</h1>
        <button type="button" id="botao-tema">Modo escuro</button>
    </header>

    <main>
        
        <section id="secao-busca">
            <h2>Buscar jogos</h2>
            
            <label for="busca-jogo">Nome do jogo:</label>
            <input 
                type="text" 
                id="busca-jogo" 
                placeholder="Digite o nome do jogo..."
            >

            <label for="filtro-categoria">Categoria:</label>
            <select id="filtro-categoria">
                <option value="Todas">Todas</option>
                <option value="Estratégia">Estratégia</option>
                <option value="Cooperativo">Cooperativo</option>
                <option value="Negociação">Negociação</option>
                <option value="Investigação">Investigação</option>
            </select>

            <label for="ordenar">Ordenar por:</label>
            <select id="ordenar">
                <option value="padrao">Padrão</option>
                <option value="nota">Maior nota</option>
                <option value="nome">Nome (A-Z)</option>
            </select>
            
        </section>

        <section id="secao-cadastro">
            <h2>Cadastrar novo jogo</h2>

            <form id="form-cadastro" novalidate>

                <label for="campo-nome">Nome do jogo:</label>
                <input
                    type="text"
                    id="campo-nome"
                    placeholder="Digite o nome do jogo..."
                >

                <label for="campo-categoria">Categoria:</label>
                <select id="campo-categoria">
                    <option value="">Selecione uma categoria</option>
                    <option value="Estratégia">Estratégia</option>
                    <option value="Cooperativo">Cooperativo</option>
                    <option value="Negociação">Negociação</option>
                    <option value="Investigação">Investigação</option>
                </select>

                <label for="campo-nota">Nota:</label>
                <input
                    type="text"
                    id="campo-nota"
                    inputmode="decimal"
                    placeholder="Ex.: 8.5"
                >

                <label for="campo-descricao">Descrição:</label>
                <textarea
                    id="campo-descricao"
                    placeholder="Descreva o jogo..."
                    maxlength="200"
                ></textarea>
                <p id="contador-descricao">0/200 caracteres</p>

                <button type="submit">Cadastrar jogo</button>

                <p id="mensagem-form" aria-live="polite"></p>

            </form>
        </section>

        <section id="painel-estatisticas">
            <h2>Estatísticas dos jogos</h2>

            <p>Total de jogos exibidos: <span id="total-jogos">0</span></p>

            <p>Jogos favoritos: <span id="total-favoritos">0</span></p>

            <p>Média das notas: <span id="media-notas">—</span></p>

            <p>Jogo com maior nota: <span id="maior-nota">—</span></p>
        </section>
        
        <section id="secao-jogos">
            <h2>Jogos</h2>
            <div id="lista-jogos"></div>
        </section>
    </main>

    <footer>
        <p>Projeto de JavaScript — GABRIEL S H ROCHA e JOÃO VICTOR TAVARES</p>
    </footer>

</body>
</html>
