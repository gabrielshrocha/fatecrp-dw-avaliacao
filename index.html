<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Jogos de Tabuleiro</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Central Jogos de Tabuleiro</h1>
    </header>

    <main>
        
        <section>
            <h2>Buscar jogos</h2>
            
            <label for="busca-jogo">Nome do jogo:</label>
            <input 
                type="text" 
                id="busca-jogo" 
                placeholder="Digite o nome do jogo..."
            >

            <label for="filtro-categoria">Categoria:</label>
            <select id="filtro-categoria">
                <option value="Todas">Todas</option>
                <option value="Estratégia">Estratégia</option>
                <option value="Cooperativo">Cooperativo</option>
                <option value="Negociação">Negociação</option>
                <option value="Investigação">Investigação</option>
            </select>
        </section>

        <section>
            <h2>Cadastrar novo jogo</h2>

            <form id="form-cadastro" novalidate>

                <label for="campo-nome">Nome do jogo:</label>
                <input
                    type="text"
                    id="campo-nome"
                    placeholder="Digite o nome do jogo..."
                >

                <label for="campo-categoria">Categoria:</label>
                <select id="campo-categoria">
                    <option value="">Selecione uma categoria</option>
                    <option value="Estratégia">Estratégia</option>
                    <option value="Cooperativo">Cooperativo</option>
                    <option value="Negociação">Negociação</option>
                    <option value="Investigação">Investigação</option>
                </select>

                <label for="campo-nota">Nota:</label>
                <input
                    type="number"
                    id="campo-nota"
                    placeholder="Ex.: 8.5"
                    min="0"
                    max="10"
                    step="0.1"
                >

                <label for="campo-descricao">Descrição:</label>
                <textarea
                    id="campo-descricao"
                    placeholder="Descreva o jogo..."
                ></textarea>

                <button type="submit">Cadastrar jogo</button>

                <p id="mensagem-form" aria-live="polite"></p>

            </form>
        </section>
            
        <section id="lista-jogos"></section>
    </main>

    <footer>
        <p>Projeto de JavaScript — GABRIEL S H ROCHA e JOÃO VICTOR TAVARES</p>
    </footer>

</body>
</html>
